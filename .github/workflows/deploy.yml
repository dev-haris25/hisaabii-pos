name: Deploy Hisabi POS App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies locally
        run: bun install

      - name: Copy .env.prod to .env
        run: cp .env.prod .env

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSHKEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-add ~/.ssh/id_rsa

      - name: Sync files to the VPS
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          REMOTE_DIR: /node-hosting/hisaabii-pos
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.next' \
            --exclude 'public/uploads' \
            -e "ssh -i ~/.ssh/id_rsa -p $PORT -o StrictHostKeyChecking=no" . \
            $USERNAME@$HOST:$REMOTE_DIR

      - name: Run build commands on VPS
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          REMOTE_DIR: /node-hosting/hisaabii-pos
        run: |
          ssh -i ~/.ssh/id_rsa -p $PORT -o StrictHostKeyChecking=no $USERNAME@$HOST "REMOTE_DIR='$REMOTE_DIR' bash -s" << 'EOF'
          set -euo pipefail

          # Install Bun if not present
          if ! command -v bun &> /dev/null; then
            echo "Installing Bun..."
            curl -fsSL https://bun.sh/install | bash
          fi

          # Load Bun into PATH (works for both new and existing installations)
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"

          # Load nvm if available (do not fail deploy when missing)
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm use 24 || nvm use default || true
          fi

          echo "Node version: $(node -v 2>/dev/null || echo 'not found')"
          echo "Bun version: $(bun -v)"

          if ! command -v pm2 &> /dev/null; then
            echo "Installing PM2 with npm..."
            npm install -g pm2
          fi
          echo "PM2 version: $(pm2 -v)"

          cd "$REMOTE_DIR" || { echo "Failed to change directory to $REMOTE_DIR"; exit 1; }
          pwd

          # Ensure Google Chrome is available for Puppeteer PDF generation
          if ! command -v google-chrome &> /dev/null; then
            echo "Google Chrome not found. Installing..."
            if sudo -n true 2>/dev/null; then
              wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y google-chrome-stable
            else
              echo "WARNING: sudo unavailable — cannot install Chrome automatically. PDF generation will fail until Chrome is installed manually."
            fi
          else
            echo "Google Chrome present: $(google-chrome --version)"
          fi

          # Ensure uploads directory exists (from .env UPLOADS_DIR, with a safe fallback)
          UPLOADS_DIR_VALUE="$(grep -E '^UPLOADS_DIR=' .env 2>/dev/null | head -n1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
          if [ -z "$UPLOADS_DIR_VALUE" ]; then
            UPLOADS_DIR_VALUE="/node-hosting/hisaabii-pos-uploads"
          fi
          mkdir -p "$UPLOADS_DIR_VALUE"
          chmod 775 "$UPLOADS_DIR_VALUE" || true
          echo "UPLOADS_DIR ready: $UPLOADS_DIR_VALUE"

          bun install || { echo "bun install failed"; exit 1; }

          # Apply DB schema before serving traffic
          bunx prisma generate || { echo "prisma generate failed"; exit 1; }
          bunx prisma migrate deploy || { echo "prisma migrate deploy failed"; exit 1; }

          # One-shot: Brittania owner email + ex-VAT menu/variant prices
          bun scripts/one-off-brittania-owner-email-and-exvat-menu.mjs || { echo "brittania one-off data fix failed"; exit 1; }

          # Clean stale build output before production build
          rm -rf .next

          bun run build || { echo "bun production build failed"; exit 1; }

          echo "Reloading PM2 apps..."
          pm2 startOrReload ecosystem.config.cjs --update-env || { echo "pm2 startOrReload failed"; exit 1; }
          pm2 save || true
          pm2 status
          EOF
